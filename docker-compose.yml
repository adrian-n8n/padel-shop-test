services:
  # ── Nginx – punto único de entrada (puerto 8080) ───────────────────────────
  nginx:
    image: nginx:alpine
    container_name: padel-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portal
      - scraper-dashboard
      - miravia-sync
    restart: unless-stopped

  # ── Portal de entrada ──────────────────────────────────────────────────────
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: padel-portal
    expose:
      - "7002"
    restart: unless-stopped

  # ── Scraper Dashboard ──────────────────────────────────────────────────────
  scraper-dashboard:
    build:
      context: ./scraper
      dockerfile: Dockerfile.dashboard
    container_name: padel-scraper-dashboard
    expose:
      - "5050"
    env_file:
      - ./scraper/.env
    volumes:
      - ./scraper:/app
    restart: unless-stopped

  # ── Shopify → Miravia Sync ─────────────────────────────────────────────────
  miravia-sync:
    build:
      context: ./shopify-miravia-sync
      dockerfile: Dockerfile
    container_name: padel-miravia-sync
    expose:
      - "7000"
    env_file:
      - ./shopify-miravia-sync/.env
    restart: unless-stopped

  # ── Next.js Shop (opcional) ────────────────────────────────────────────────
  padel-shop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padel-shop
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    volumes:
      - ./public/images:/app/public/images
    profiles:
      - shop

  # ── Scraper CLI (uso puntual) ──────────────────────────────────────────────
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: padel-scraper
    volumes:
      - ./public/images:/app/public/images
      - ./src/data:/app/src/data
      - ./scraper:/app/scraper
    profiles:
      - scraper
