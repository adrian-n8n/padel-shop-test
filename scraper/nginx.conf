events { worker_connections 1024; }

http {
  # ── sub_filter necesita deshabilitar compresión en origen ─────────────────
  gzip off;

  server {
    listen ${PORT};

    # ── Portal (raíz) ──────────────────────────────────────────────────────
    location = / {
      proxy_pass http://127.0.0.1:7002/;
      proxy_set_header Host $host;
    }

    # ── Scraper Dashboard (/scraper/) ──────────────────────────────────────
    location /scraper/ {
      proxy_pass         http://127.0.0.1:5050/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Prefix /scraper;

      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering    off;

      # Reescribir rutas absolutas en HTML/JS/CSS para que funcionen bajo /scraper/
      sub_filter_once off;
      sub_filter_types text/html text/javascript application/javascript text/css;
      sub_filter 'href="/'      'href="/scraper/';
      sub_filter 'src="/'       'src="/scraper/';
      sub_filter 'action="/'    'action="/scraper/';
      sub_filter "fetch('/"     "fetch('/scraper/";
      sub_filter 'fetch("/'     'fetch("/scraper/';
      sub_filter "url: '/"      "url: '/scraper/";
      sub_filter 'url: "/'      'url: "/scraper/';
      sub_filter "/api/"        "/scraper/api/";
      sub_filter "/static/"     "/scraper/static/";
      sub_filter "/events"      "/scraper/events";
    }

    # ── Miravia Sync (/miravia/) ──────────────────────────────────────────
    location /miravia/ {
      proxy_pass         http://127.0.0.1:7000/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Forwarded-Prefix /miravia;

      # SSE: no bufferizar
      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 600s;

      sub_filter_once off;
      sub_filter_types text/html text/javascript application/javascript text/css;
      sub_filter 'href="/'      'href="/miravia/';
      sub_filter 'src="/'       'src="/miravia/';
      sub_filter "fetch('/"     "fetch('/miravia/";
      sub_filter 'fetch("/'     'fetch("/miravia/';
      sub_filter "url: '/"      "url: '/miravia/";
      sub_filter 'url: "/'      'url: "/miravia/';
      sub_filter "/api/"        "/miravia/api/";
      sub_filter "/static/"     "/miravia/static/";
    }
  }
}
